<!doctype html><meta charset="utf-8"><title>Surface detail, close up</title>
<style>html,body{margin:0;background:#20242a;color:#dde;font:13px ui-monospace,monospace}canvas{display:block}#cap{position:fixed;left:10px;top:8px;white-space:pre;text-shadow:0 1px 2px #000}</style>
<div id="cap"></div>
<script type="module">
// (GC 0.90) A few models from every mode, close, under a low sun, so the surface detail can be seen and compared:
//   /test/surface.html            with it          /test/surface.html?surf=0   without it (as before 0.70)
//   ?set=base|ground|people|env  which models;  ?d=  how far the camera stands;  ?sun=  the sun's height (low shows the relief)
//   ?floor=  the ground's layer (8 soil, 12 sand, 13 snow, 14 grass, 15 regolith);  ?sea=1  a strip of moving water in front
import * as THREE from '../js/vendor/three.js';
import { detail, water } from '../js/surface.js';
import { staticGeo } from '../js/model3d.js';
const q = new URLSearchParams(location.search), W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.shadowMap.enabled = true; document.body.appendChild(r.domElement); r.setClearColor('#7d8a96');
r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xc8d4e0, 0x6a5a48, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dd, 3.2), el = +(q.get('sun') || 22) * Math.PI / 180;
sun.position.set(Math.cos(el) * 20, Math.sin(el) * 20, Math.cos(el) * 9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, far: 80 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#8c7a5c', roughness: 1 }));
floor.material.defines = { GC_KIND: (+(q.get('floor') || 8)).toFixed(1) }; floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
if (q.get('sea')) { const sea = new THREE.Mesh(new THREE.PlaneGeometry(60, 5), water(new THREE.MeshStandardMaterial({ color: '#2f5866', roughness: 0.12, metalness: 0.3, transparent: true, opacity: 0.9 }))); sea.rotation.x = -Math.PI / 2; sea.position.set(0, 0.02, 4.5); scene.add(sea); }
const SETS = {
  base: [['b:hq', 3.2], ['b:depot', 3.2], ['prop_hesco', 2.4], ['prop_slab_top_b', 2.4], ['prop_fortwall', 2.4], ['prop_crate', 1.2]],
  ground: [['veh_lrv', 3.2], ['prop_cover1', 2.2], ['prop_turret', 2.2], ['molt_M', 2.6], ['foundry_M', 2.6], ['prop_tree_dead', 3]],
  people: [['soldier', 2], ['vanguard', 2.3], ['engineer', 2], ['citizen_a', 1.9], ['medic', 2], ['molt_L', 2]],
  env: [['prop_tree_leaf', 4], ['prop_tree_pine', 4.5], ['prop_rock_b', 2.2], ['prop_tree_dead', 3.5], ['prop_rock_spire', 3.4], ['prop_shroom', 2.4]],
};
const set = SETS[q.get('set') || 'base'], pack = set.some(([n]) => n.startsWith('b:')) ? await (await fetch('../assets/models/buildings.json')).json() : null;
const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.82, metalness: 0.05 });
let x = -((set.length - 1) * 3.2) / 2; const names = [];
for (const [n, s] of set) {
  const d = n.startsWith('b:') ? pack[n.slice(2)] : await (await fetch(`../assets/models/${n}.json`)).json();
  if (!d) { x += 3.2; continue; }
  const g = staticGeo(d), o = new THREE.Mesh(g, mat), sz = Math.max(d.size[0], d.size[1], d.size[2]);
  o.scale.setScalar(s / sz); o.position.set(x, 0, 0); o.rotation.y = 0.6; o.castShadow = o.receiveShadow = true; scene.add(o); names.push(n);
  x += 3.2;
}
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 200), dist = +(q.get('d') || 14);
cam.position.set(0, dist * 0.45, dist); cam.lookAt(0, 1, 0);
const t0 = performance.now();
const draw = () => { r.render(scene, cam); document.getElementById('cap').textContent = `${names.join('  ')}\nsurface detail: ${/surf=0/.test(location.search) ? 'off' : detail.ready ? 'on' : 'loading'}`; window.__ready = detail.ready || /surf=0/.test(location.search) || performance.now() - t0 > 8000; requestAnimationFrame(draw); };
draw();
</script>
