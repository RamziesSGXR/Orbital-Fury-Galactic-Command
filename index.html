<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d0c">
<meta name="description" content="Orbital Fury: Galactic Command. One war, fought from the map room, from orbit, from the gunship and from the ground. A prototype.">
<title>Orbital Fury: Galactic Command</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app/icon-192.png">
<link href="css/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="css/gc.css">
</head>
<body>

<!-- ================= TITLE ================= -->
<!-- (0.60) One main menu for the whole game: a bar of tabs along the top (HOME, PLAY, COLLECTION, CAREER, STORE, OPTIONS)
     and the tab's page under it, drawn by js/main.js (TABS). Behind it all, the war room, drawn live (js/core/warroom.js).
     (GC 0.75) Your crest, at the right of the bar, opens your livery: it is on every screen, in place of a LIVERY tab. -->
<section id="s-title" class="scr on">
  <canvas id="tbg" aria-hidden="true" tabindex="-1"></canvas>
  <div id="tscrim"></div>
  <div class="tmain">
    <header id="t-bar">
      <img class="tlogo" src="assets/icon.svg" alt="" width="50" height="58">
      <div class="tname"><span>ORBITAL FURY</span><b>GALACTIC COMMAND</b></div>
      <nav id="t-tabs" class="ttabs" role="tablist" aria-label="Main menu"></nav>
      <button class="twho" id="t-me" type="button" title="Your livery: your name, emblem and colours"><span class="twn"><span id="t-who"></span><small>YOUR LIVERY</small></span><canvas id="t-crest" width="160" height="160"></canvas></button>
    </header>
    <main id="t-page"></main>
    <p class="ver" id="t-ver"></p>
  </div>
</section>

<!-- ================= FOUND YOUR FACTION ================= -->
<section id="s-found" class="scr">
  <div class="fwrap">
    <header class="fhd"><b>FOUND YOUR COMMAND</b><span>Pick a livery to start from. Your name, emblem and colours go with you to every game; make them your own any time: click your crest, at the top right of every screen.</span></header>
    <div class="fstyles lvcards" id="f-styles"></div>
    <div class="fform fthree">
      <label>COMMAND NAME<input id="f-name" maxlength="32" autocomplete="off"></label>
      <label>HEADQUARTERS (YOUR CAPITAL)<input id="f-capital" maxlength="24" autocomplete="off"></label>
      <label>MOTTO<input id="f-motto" maxlength="40" autocomplete="off"></label>
    </div>
    <div class="plate" id="f-open" style="padding:10px 12px;margin:10px 0">
      <div class="fpick"><span>THE ENEMY</span><span id="f-level" class="row grow" style="flex:1"></span></div>
      <div class="fpick"><span>OPENING FLEETS</span><span id="f-fleets" class="row grow" style="flex:1"></span></div>
      <div class="fpick" style="margin-bottom:0"><span>STATIONS AND BASES</span><span id="f-posts" class="row grow" style="flex:1"></span></div>
    </div>
    <div class="frow"><button class="plate btn" id="f-back">BACK</button><button class="plate btn" id="f-roll">NEXT STYLE</button><button class="plate btn go" id="f-go">TAKE COMMAND</button></div>
  </div>
</section>

<!-- ================= THE WAR ROOM (galaxy) ================= -->
<section id="s-war" class="scr">
  <header id="top"></header>
  <main id="main">
    <div id="stage"><canvas id="map"></canvas>
      <div id="turn"></div>
      <div id="zoom"><button class="plate btn sm" data-a="zin" aria-label="Zoom in">+</button><button class="plate btn sm" data-a="zout" aria-label="Zoom out">−</button></div>
      <button id="bulletin" data-a="tab" data-t="int"></button></div>
    <aside id="side"><div id="panel"></div></aside>
  </main>
  <div id="coach" hidden></div>
  <nav id="mins"></nav>
  <footer id="deck"></footer>
  <div id="fight" hidden><div id="fcoach" hidden></div><div id="fbody"></div></div>
</section>

<!-- ================= A THEATRE: the ground, the station, the base ================= -->
<!-- One frame for all three: the command bar on top (crest, where you are, the numbers that matter there), the
     world itself, and one bar of tools along the bottom. Each theatre fills these in (js/modes/*.js). -->
<section id="s-theatre" class="scr">
  <header id="th-top">
    <button class="crest" id="th-livery" aria-label="Your livery" title="Your livery"><canvas id="crest-th" width="64" height="64"></canvas></button>
    <div class="ttl"><span id="th-where"></span><small id="th-kind"></small></div>
    <div class="ro" id="th-stats"></div>
    <div class="thb"><button class="plate btn sm" id="th-pause">II</button><button class="plate btn sm" id="th-speed">1×</button><button class="plate btn sm" id="th-menu">MENU</button><button class="plate btn sm" id="th-leave">TO THE MAP</button></div>
  </header>
  <div id="th-war" class="hidden"></div>
  <div id="th-stage">
    <canvas id="v-ground" class="tv"></canvas>
    <canvas id="v-orbit" class="tv"></canvas>
    <canvas id="v-base" class="tv"></canvas>
    <div id="th-msg"></div>
    <div id="th-feed"></div>
    <div id="th-side" class="hidden"></div>
    <div id="th-desk"></div>
    <div id="th-tip" class="hidden"></div>
  </div>
  <div id="th-sel" class="hidden"></div>
  <nav id="th-tabs"></nav>
  <footer id="th-bar"></footer>
</section>

<!-- ================= between places ================= -->
<div id="trans" hidden><div class="tbox"><canvas id="tr-crest" width="120" height="120"></canvas><p class="over" id="tr-over"></p><h2 id="tr-title"></h2><p id="tr-sub"></p><div class="bar big2"><i id="tr-bar"></i></div></div></div>
<div id="menu" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
